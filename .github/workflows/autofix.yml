---
name: autofix.ci
on:
  pull_request:
  push:
    branches: ["trunk"]

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      docs-pnpm: ${{ steps.filter.outputs.docs-pnpm }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs-pnpm:
              - 'doc/pnpm-lock.yaml'
  autofix:
    runs-on: ubuntu-latest
    needs: check-changes
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: setup sqlx
        run: nix develop -L -v -c sqlx database setup --source ./wire/lib/src/cache/migrations/
      - name: autofix sqlx
        run: nix develop -L -v -c cargo sqlx prepare --workspace
      - name: clippy --fix
        run: nix develop -L -v -c cargo clippy --fix
      - name: pre-commit run
        run: nix develop -L -v -c pre-commit run --all-files
        continue-on-error: true
      - name: Upgrade Hash
        if: ${{ needs.check-changes.outputs.docs-pnpm == 'true' }}
        run: bash ./doc/upgrade.sh
      - uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27
